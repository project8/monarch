# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"
  apt_packages:
    - cmake
    - doxygen
    - graphviz
    - libboost-filesystem-dev
    - libhdf5-dev
    - pybind11-dev
    - rapidjson-dev
    - libyaml-cpp-dev
    - tree
  jobs:
    pre_build:
      - git submodule update --init --recursive
      - cmake -S . -B _rtd_build -DMonarch_BUILD_PYTHON=ON -DPBUILDER_PY_INSTALL_IN_SITELIB=ON
      - cmake --build _rtd_build --target install -- -j$(nproc)
      - python ./Documentation/run_doxygen.py
      - mkdir -p $READTHEDOCS_OUTPUT/html
      - mv ./user_doxygen_out/html $READTHEDOCS_OUTPUT/html/_static
      - tree

# Build documentation in the "Documentation/" directory with Sphinx
sphinx:
   configuration: Documentation/conf.py

submodules:
  recursive: true

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
  - requirements: Documentation/requirements.txt
